# Base markdownlint config. Override per repo/folder with .markdownlint.yaml
# or .markdownlint-cli2.yaml. Rules: https://github.com/DavidAnson/markdownlint#rules--aliases
config:
  default: true
  MD013: false # disable line length
  MD024: false # duplicate headings
  MD036: false # emphasis used as heading
  MD040: false # fenced code language
  MD041: false # first line top-level heading
  MD060: false # table column style
